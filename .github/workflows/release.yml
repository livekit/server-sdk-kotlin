# After a release PR merges: tag and create the GitHub release, then
# publish to Maven Central. The step that cannot be undone comes last.
# The tool stops at the tag and the release; publishing is this
# workflow's job, driven by the `releases` output.
name: Release

on:
  # No `branches` filter: an rc PR from pre-release.yml targets the branch
  # the workflow was run on. The condition on the first job decides which
  # PRs release.
  pull_request:
    types: [closed]
  # A failed job is re-run with "Re-run failed jobs" on the run itself:
  # that keeps the merge commit. This trigger is for a run that needs a
  # fixed workflow file from the branch. `verwalter release` resumes from
  # the current state (tags, releases) and skips what is done.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to publish. Set it to the release tag when the tag exists. Empty is the branch head.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    # Only a release PR the tool opened: the branch prefix alone would let
    # any pushed `release/*` branch trigger a publish.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.user.login == 'verwalter-release[bot]' && contains(github.event.pull_request.body, '<!-- verwalter release -->'))
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.verwalter.outputs.released }}
      releases: ${{ steps.verwalter.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit itself: a push to main right after the merge
          # must not move the tags.
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0
      - id: verwalter
        uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        with:
          command: release

  # A version Maven Central already has is skipped (publish.exists_url),
  # so a re-run of this job is safe. The GitHub release stays a draft
  # until the publish succeeds.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0  # tags decide what is published
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Write signing key and credentials into gradle.properties
        run: |
          echo "$GPG_KEY_ARMOR" | base64 --decode > "$RUNNER_TEMP/release.asc"
          gpg --quiet --output "$RUNNER_TEMP/release.gpg" --dearmor "$RUNNER_TEMP/release.asc"
          sed -i -e "s,nexusUsername=,nexusUsername=$NEXUS_USERNAME,g" gradle.properties
          sed -i -e "s,nexusPassword=,nexusPassword=$NEXUS_PASSWORD,g" gradle.properties
          sed -i -e "s,signing.keyId=,signing.keyId=$GPG_KEY_ID,g" gradle.properties
          sed -i -e "s,signing.password=,signing.password=$GPG_PASSWORD,g" gradle.properties
          sed -i -e "s,signing.secretKeyRingFile=,signing.secretKeyRingFile=$RUNNER_TEMP/release.gpg,g" gradle.properties
        env:
          GPG_KEY_ARMOR: ${{ secrets.SIGNING_KEY_ARMOR }}
          GPG_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: publish
          releases: ${{ needs.release.outputs.releases }}

  # The end state, asserted: `status --check` fails when the tag is not on
  # the remote, the GitHub release is missing or still a draft, or Maven
  # Central does not have the version.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0
      # A release to Maven Central takes minutes to reach repo1.maven.org,
      # which is the URL the registry check asks.
      - name: Wait for the version on Maven Central
        run: |
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          URL="https://repo1.maven.org/maven2/io/livekit/livekit-server/$VERSION/livekit-server-$VERSION.pom"
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "$URL" && exit 0
            sleep 60
          done
          echo "::error::$URL is not there after 60 minutes"
          exit 1
      - uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        with:
          command: status
          args: --check
